general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fractional_scaling = 2
}

auth {
    pam:enabled = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fade, 1, 2.5, easeOutQuint
}

background {
    monitor =
    path = screenshot
    color = rgba(24, 24, 37, 1.0)
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 0.9
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.05
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb(cdd6f4)
    font_size = 72
    font_family = Geist
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgb(a6adc8)
    font_size = 18
    font_family = Geist
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome back, $USER
    color = rgb(cdd6f4)
    font_size = 20
    font_family = Geist
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgb(89b4fa)
    inner_color = rgb(30, 30, 46)
    font_color = rgb(cdd6f4)
    halign = center
    valign = center
    position = 0, -40

    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <span font_family="Geist">Unlock</span>

    rounding = 12
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    fail_text = <span font_family="Geist" font_size="12"><i>$FAIL <b>($ATTEMPTS)</b></i></span>
}
