input {
  kb_layout = us
  kb_options = compose:caps
  repeat_rate = 40
  repeat_delay = 250
  numlock_by_default = true

  touchpad {
    clickfinger_behavior = true
    scroll_factor = 0.4
  }
}

# ponytail: scroll_touchpad no es un windowrule válido sin plugin. Eliminado.
# windowrule = scroll_touchpad 1.5, ^(Alacritty|kitty|foot)$
# windowrule = scroll_touchpad 0.2, ^com\.mitchellh\.ghostty$
