general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(b4befe) rgb(cba6f7) 45deg
    col.inactive_border = rgb(45475a)

}

decoration {
    rounding = 10
    rounding_power = 2
    dim_inactive = true
    dim_strength = 0.15

    active_opacity = 0.92
    inactive_opacity = 0.85
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 6
        passes = 3
        ignore_opacity = true
        noise = 0.01
        contrast = 0.9
        brightness = 0.8
        popups = true
        popups_ignorealpha = 0.2
    }

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgb(11111b)
        color_inactive = rgb(11111b)
        offset = 0 4
        scale = 0.96
    }
}

animations {
    enabled = yes

    # Curves
    bezier = catppuccin, 0.05, 0.9, 0.1, 1.0
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1
    bezier = overshoot, 0.5, 0.9, 0.1, 1.1

    # Windows
    animation = windows, 1, 4, catppuccin, slide
    animation = windowsIn, 1, 4, easeOutQuint, popin 85%
    animation = windowsOut, 1, 3, quick, popin 85%
    animation = windowsMove, 1, 3, catppuccin, slide

    # Fade
    animation = fade, 1, 3, quick
    animation = fadeIn, 1, 2, almostLinear
    animation = fadeOut, 1, 2, almostLinear
    animation = fadeSwitch, 1, 3, catppuccin
    animation = fadeDim, 1, 4, catppuccin
    animation = fadeLayers, 1, 3, quick
    animation = fadeLayersIn, 1, 2, almostLinear
    animation = fadeLayersOut, 1, 2, almostLinear

    # Layers (menus, notifications, etc.)
    animation = layers, 1, 3, easeOutQuint, fade
    animation = layersIn, 1, 3, easeOutQuint, fade
    animation = layersOut, 1, 2, quick, fade

    # Workspaces
    animation = workspaces, 1, 4, catppuccin, slidefade 20%
    animation = workspacesIn, 1, 3, catppuccin, slidefade 20%
    animation = workspacesOut, 1, 3, catppuccin, slidefade 20%
    animation = specialWorkspace, 1, 3, catppuccin, slidefade 20%
    animation = specialWorkspaceIn, 1, 3, catppuccin, slidefade 20%
    animation = specialWorkspaceOut, 1, 3, catppuccin, slidefade 20%

    # Border
    animation = border, 1, 8, catppuccin

    # ponytail: loop keeps GPU rendering at refresh rate; disable if battery matters
    animation = borderangle, 0, 30, catppuccin, loop
}

misc {
    vrr = 2
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    animate_mouse_windowdragging = false
    enable_swallow = true
    swallow_regex = ^(kitty|alacritty|foot)$
}
