# :: Media Keys
bindel = , XF86AudioRaiseVolume, exec, ~/.local/bin/osd.sh volume up
bindel = , XF86AudioLowerVolume, exec, ~/.local/bin/osd.sh volume down
bind = , XF86AudioMute, exec, ~/.local/bin/osd.sh volume mute
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, ~/.local/bin/osd.sh brightness up
bindel = , XF86MonBrightnessDown, exec, ~/.local/bin/osd.sh brightness down
# bind = SHIFT, XF86MonBrightnessUp, exec, brightnessctl s 100%
# bind = SHIFT, XF86MonBrightnessDown, exec, brightnessctl s 1%
# bind = , XF86KbdBrightnessUp, exec, ...
# bind = , XF86KbdBrightnessDown, exec, ...
# bind = , XF86KbdLightOnOff, exec, ...
# bind = , XF86TouchpadToggle, exec, ...
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPrev, exec, playerctl previous
