# :: Zoom
bind = $mainMod CTRL, Z, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.int + 0.5')
bind = $mainMod CTRL ALT, Z, exec, hyprctl keyword cursor:zoom_factor 1.0

# :: Lock / System
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, M, exit,
