# Window rules
# Format: windowrule = EFFECT MATCH (no comma, hyprlang v2 syntax)

# Suppress maximize requests from all apps
windowrule = suppress_event maximize class:.*

# Float & center common dialogs
windowrule = float class:^(pavucontrol)$
windowrule = size 800 500 class:^(pavucontrol)$
windowrule = center class:^(pavucontrol)$

windowrule = float class:^(blueman-manager)$
windowrule = size 700 500 class:^(blueman-manager)$
windowrule = center class:^(blueman-manager)$

windowrule = float class:^(nm-connection-editor)$
windowrule = center class:^(nm-connection-editor)$

# Polkit authentication dialogs
windowrule = float class:^(polkit-gnome-authentication-agent-1)$
windowrule = float class:^(org\.kde\.polkit-kde-authentication-agent-1)$
windowrule = center class:^(polkit-gnome-authentication-agent-1)$
windowrule = center class:^(org\.kde\.polkit-kde-authentication-agent-1)$
windowrule = stay_focused class:^(polkit-gnome-authentication-agent-1)$
windowrule = stay_focused class:^(org\.kde\.polkit-kde-authentication-agent-1)$

# File chooser / save dialogs
windowrule = float title:^(Open File)$
windowrule = float title:^(Open Folder)$
windowrule = float title:^(Save File)$
windowrule = center title:^(Open File)$
windowrule = center title:^(Open Folder)$
windowrule = center title:^(Save File)$

# Calculator / picker dialogs
windowrule = float class:^(org\.gnome\.Calculator)$
windowrule = float class:^(org\.gnome\.Calendar)$
windowrule = center class:^(org\.gnome\.Calculator)$
windowrule = center class:^(org\.gnome\.Calendar)$

# Keep pinentry focused
windowrule = float class:^(pinentry-.*)$
windowrule = stay_focused class:^(pinentry-.*)$
windowrule = center class:^(pinentry-.*)$

# Visual tweaks
windowrule = no_blur fullscreen:1
windowrule = no_dim fullscreen:1
windowrule = animation popin 90% class:^(wofi)$
windowrule = animation fade class:^(mako)$

# FlowFi - PWA
windowrule = float class:^(chrome-www\.flowfi\.app__-Default)$
windowrule = center class:^(chrome-www\.flowfi\.app__-Default)$
windowrule = size 1280 720 class:^(chrome-www\.flowfi\.app__-Default)$
windowrule = workspace 5 class:^(chrome-www\.flowfi\.app__-Default)$
