# Wayle palette: generated by Matugen, follows wallpaper
# (wayle 0.7.0 built-in re-theme on wallpaper change is broken, so we theme it externally)
[styling.palette]
bg = "{{ colors.surface.default.hex }}"
surface = "{{ colors.surface_container_low.default.hex }}"
elevated = "{{ colors.surface_container_high.default.hex }}"
fg = "{{ colors.on_surface.default.hex }}"
fg-muted = "{{ colors.on_surface_variant.default.hex }}"
primary = "{{ colors.primary.default.hex }}"
red = "{{ colors.error.default.hex }}"
yellow = "{{ colors.tertiary.default.hex }}"
green = "{{ colors.secondary.default.hex }}"
blue = "{{ colors.primary.default.hex }}"
